name = "frontdoor-analytics"
main = "src/index.ts"
compatibility_date = "2026-06-06"

[vars]
ALLOWED_ORIGINS = "https://frontdoor.health,https://www.frontdoor.health,https://drdronavalli.com,https://www.drdronavalli.com"
ALLOWED_PRACTICE_SLUGS = "frontdoor-health,drdronavalli,mariposa,northhillspsychiatry,northwestpsychiatry"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 300
period = 60

[[d1_databases]]
binding = "DB"
database_name = "frontdoor_analytics"
database_id = "ffcf1889-843c-4ffd-ad9f-4d6392a8c6d2"

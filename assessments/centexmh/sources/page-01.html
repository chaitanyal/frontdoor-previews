About NeuroStar TMS Therapy NeuroStar TMS Therapy is an FDA-cleared safe and effective non-drug depression treatment for patients who are not satisfied with the results of standard drug therapy. This novel treatment option provides benefits without the side effects often associated with antidepressant medication.1, 2, 3

NeuroStar TMS (transcranial magnetic stimulation) Therapy1:

Is similar to magnetic resonance imaging (MRI)
Uses precisely targeted magnetic pulses
Stimulates key areas of the brain that are underactive in patients with depression
Is conducted right in the doctors office


Facts about NeuroStar TMS Depression Treatment

Patients are awake and alert during treatment
Patients can go back to their normal activities immediately after treatment
In-office treatment takes 37 minutes
Treatment is administered 5 days a week, for approximately 4 to 6 weeks


With more than 18,000 patients treated, this novel treatment approach to achieving remission is bringing new hope to patients every day.1


NeuroStar TMS Therapy may not be right for everyone. Talk to a NeuroStar physician about how this proven depression treatment can help and whether it is right for you. Call (512) 964-6992 for more information on this exciting treatment option.




Proven Results






Remission from depression is possible with NeuroStar TMS Therapy

Clinical studies with 800 patients have shown that NeuroStar TMS Therapy can help achieve remission for patients living with depression.4, 5, 6, 7, 8

For many patients, depression symptoms significantly improved or went away after 4 to 6 weeks of treatment with NeuroStar TMS Therapy4:

1 in 2 patients experienced significant improvement
1 in 3 patients were symptom free

In an NIMH-funded, independent, randomized controlled trial, patients treated with TMS using the NeuroStar TMS System, were four times more likely to achieve remission compared to patients receiving sham treatment (P = 0.0173; odds ratio = 4.05).7

Solid Safety

NeuroStar TMS Therapy has a proven safety profile

NeuroStar TMS Therapy is safe and easy to tolerate. Because it is not a depression drug, NeuroStar TMS Therapy doesnt have the side effects that are often associated with antidepressant medication.1, 2 More than 18,000 patients have been treated with NeuroStar TMS Therapy.

NeuroStar TMS Therapy is free of systemic side effects typically experienced with antidepressant medications1, 2

NeuroStar TMS Therapy Side Effects

In clinical trials, fewer than 5% of patients discontinued treatment with NeuroStar TMS Therapy due to adverse events. The most common side effect associated with NeuroStar TMS Therapy is temporary pain or discomfort at or near the treatment site during treatment. When this occurs it is temporary, and typically occurs only during the first week of treatment.

Other side effects (occurring in =5% of patients and twice the rate of placebo) include:

Eye pain

Toothache

Muscle twitch

Facial pain

Pain of the skin

There is a rare risk of seizure with TMS Therapy (0.1% of patients). There is no adverse effect on cognition.1, 2

Patients should notify their doctor if they experience worsening depression symptoms, signs or symptoms of suicidal behavior and/or unusual behavior. Family members and support individuals should also be aware of the need to observe patients and notify their treatment provider if symptoms worsen.1

NeuroStar TMS Therapy should not be used with patients who have non-removable conductive metal or stimulator implants in or near the head or patients who have active or inactive implants such as deep brain stimulators, cochlear implants, and vagus nerve stimulators.1


How Does NeuroStar TMS Therapy Work?

Transcranial magnetic stimulation (TMS) uses a targeted pulsed magnetic field, similar to what is used in an MRI (magnetic resonance imaging) machine. While the patient is awake and alert, NeuroStar TMS Therapy stimulates areas of the brain that are underactive in depression.1

NeuroStar TMS Therapy is an in-office treatment that takes 37 minutes, is performed while the patient sits in a chair, and is administered five days a week, for up to four to six weeks.

Simple steps for NeuroStar TMS Therapy:

Step One: The patient reclines comfortably in the treatment chair, awake and alert
Step Two: A small curved device containing the magnetic coil rests lightly on the patients head
Step Three: The device delivers focused magnetic stimulation directly to the target areas of the brain
Step Four: The patient can immediately resume normal activities

During treatment, the patient hears a clicking sound and feels a tapping sensation on the head. The most common side effect is generally mild-to-moderate pain or discomfort at or near the treatment area during the session. When this occurs it is temporary, and typically occurs only during the first week of treatment.

There are no effects on alertness or understanding; patients being treated with NeuroStar TMS Therapy can drive themselves to and from their treatment sessions.

NeuroStar TMS Therapy may not be right for everyone, so talk to a NeuroStar physician to learn more about how this proven depression treatment may help you or your loved one.

Is NeuroStar TMS Therapy Right for You?


If you are a patient suffering from depression who has not had satisfactory results from standard antidepressant medication, NeuroStar TMS Therapy may be able to help. This novel alternative depression treatment is not a drug, so it does not circulate throughout the body and does not have the side effects that are associated with drug therapy.

If you agree with two or more of these statements, ask your doctor about NeuroStar TMS Therapy:

Depression symptoms have interfered with my daily life.
I am not satisfied with the results I get from depression medication.
I have had, or have worried about, side effects from depression medications.
I have switched medications for depression due to side effects.
I am interested in a proven, non-drug therapy for depression.

For patients with depression who have not benefited from antidepressant medication, NeuroStar TMS Therapy can offer hope.

NeuroStar TMS Therapy may not be right for everyone, so talk to a NeuroStar physician to learn more about how this proven alternative depression treatment has helped other people with their depression, and whether it may help you or your loved one. Call (512) 964-6992 for more information on this exciting treatment option.


What Is SPRAVATO?
SPRAVATO is the only FDA-approved nasal spray for adults with treatment-resistant depression that can be taken with or without an oral antidepressant.

SPRAVATO can help reduce depression symptoms when antidepressants havent worked well for you.

SPRAVATO is the only FDA-approved nasal spray for treatment-resistant depression
SPRAVATO is an NMDA receptor antagonist believed to work differently from traditional antidepressants by acting on glutamate.
The exact way SPRAVATO works is unknown.
While the exact role of glutamate in depression is unknown, it is a chemical messenger found in the brain that is thought to help regulate depression.
